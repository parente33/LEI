<!DOCTYPE html>
<html>

<head>
    <title>Programando o cliente: exemplo5</title>
    <meta charset=”UTF-8” />
    <link rel="stylesheet" href="w3.css" />
</head>

<body>

    <div class="w3-card-4">

        <header class="w3-container w3-blue">
            <h1>Programando o cliente: exemplo4</h1>
            <h2>Parágrafo camaleão V2</h2>
        </header>

        <div class="w3-container">
            <p id="p1">Sou um parágrafo e mudo de cor de fundo quando o rato me passa por cima ou
                quando me clicas com ele.</p>
        </div>

        <footer class="w3-container w3-blue">
            <h5>Gerado em EW2026, <span id="datahora"></span></h5>
        </footer>
    </div>
    <script>
        document.getElementById("datahora").innerHTML = document.lastModified

        const paragrafo = document.getElementById("p1");

        // 1. Mudar de cor ao clicar (o que já tínhamos)
        paragrafo.addEventListener("click", function() {
            if(this.style.color == "red")
                this.style.color = "black"
            else
                this.style.color = "red"
        });

        // 2. Mudar de cor quando o rato passa por cima
        paragrafo.addEventListener("mouseenter", function() {
            this.style.backgroundColor = "yellow";
            this.style.cursor = "pointer"; // Opcional: muda o cursor para a "mãozinha"
        });

        // 3. Voltar ao normal quando o rato sai
        paragrafo.addEventListener("mouseleave", function() {
            this.style.backgroundColor = "transparent";
        });
    </script>
</body>

</html>
