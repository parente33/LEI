<!DOCTYPE html>
<html>

<head>
    <title>Programando o cliente: exemplo1</title>
    <meta charset=”UTF-8” />
    <link rel="stylesheet" href="w3.css" />
</head>

<body>

    <div class="w3-card-4">

        <header class="w3-container w3-blue">
            <h1>Programando o cliente: exemplo2</h1>
        </header>

        <div class="w3-container">
            <p>Clica no botão para veres de onde vieste.</p>
            <button onclick="myFunction()">De onde vim?</button>   
            <p id="proveniencia"></p> 
        </div>

        <footer class="w3-container w3-blue">
            <h5>Gerado em EW2026, <span id="datahora"></span></h5>
        </footer>
    </div>
    <script>
        document.getElementById("datahora").innerHTML = document.lastModified;

        function myFunction() {
            var prov = document.referrer
            if(!prov)
                document.getElementById("proveniencia").innerHTML = "Acedi do servidor local..."
            else
                document.getElementById("proveniencia").innerHTML = document.referrer;
        }

    </script>
</body>

</html>
